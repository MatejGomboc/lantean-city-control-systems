name: CI - Main Branch

permissions:
    contents: read

on:
    push:
        branches: [main]

    workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"

jobs:
    quick-checks:
        name: Quick Checks (fmt, docs, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Verify Rust toolchain pin consistency
              run: bash .github/scripts/check-toolchain-pin.sh

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: rustfmt

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                node-version: "lts/*"
                cache: npm
                cache-dependency-path: package-lock.json

            - name: Install markdownlint-cli2
              run: npm ci

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Lint markdown
              run: npm run lint:md

            # Offline: every relative link and #anchor across the Markdown must
            # resolve. No network, so it is deterministic and safe to gate on;
            # external URLs are checked by the scheduled links.yml instead,
            # because third-party sites go down independently of this repo.
            # lychee is installed from its pinned release archive with a checksum
            # check rather than via lycheeverse/lychee-action, so the list of
            # actions the repository runs stays short.
            - name: Install lychee
              shell: bash
              env:
                LYCHEE_VERSION: v0.24.2
                LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
              run: |
                curl -sSfL -o lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
                echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum --check --strict
                tar -xzf lychee.tar.gz
                sudo install -m 755 lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
                rm -rf lychee.tar.gz lychee-x86_64-unknown-linux-gnu
                lychee --version

            - name: Check internal links and anchors
              run: lychee --offline --include-fragments --no-progress --root-dir "$(pwd)" --exclude-path node_modules --exclude-path target "./**/*.md"

            - name: Check documentation
              run: cargo doc --no-deps --document-private-items
              env:
                RUSTDOCFLAGS: "-Dwarnings"

    rust:
        name: Rust (${{ matrix.os }})
        needs: quick-checks
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: clippy

            - name: Get Rust version
              id: rust-version
              shell: bash
              run: |
                # Cross-platform: use shasum on macOS, sha256sum elsewhere
                if command -v sha256sum &> /dev/null; then
                    HASH_CMD="sha256sum"
                else
                    HASH_CMD="shasum -a 256"
                fi
                echo "version=$(rustc --version | $HASH_CMD | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            # Restore and save the cache that pull requests restore read-only
            - name: Rust cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: |
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/
                key: rust-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
                restore-keys: |
                    rust-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-

            - name: Run Clippy
              run: cargo clippy --locked --all-targets --all-features -- -D warnings

            - name: Build
              run: cargo build --locked --verbose

            - name: Run tests
              run: cargo test --locked --verbose

    msrv:
        name: Minimum Rust version
        needs: quick-checks
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The version Cargo.toml declares, so the job follows the manifest.
            - name: Read rust-version from Cargo.toml
              id: msrv
              run: |
                version="$(sed -nE 's/^rust-version = "([0-9.]+)"$/\1/p' Cargo.toml)"
                if [[ -z "$version" ]]; then
                    echo "No rust-version in Cargo.toml"
                    exit 1
                fi
                echo "version=$version" >> "$GITHUB_OUTPUT"

            # rustup rather than the pinned toolchain action: that pin is the
            # development toolchain, which check-toolchain-pin.sh holds to one
            # version across the workflows.
            - name: Install the minimum toolchain
              run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal

            # A dependency bump that needs a newer Rust fails here instead of
            # passing unnoticed under the development toolchain.
            - name: Check on the minimum Rust version
              run: cargo "+${{ steps.msrv.outputs.version }}" check --locked --all-targets

    tablet:
        name: Tablet client
        needs: quick-checks
        runs-on: ubuntu-latest
        timeout-minutes: 10

        defaults:
            run:
                working-directory: clients/tablet

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                node-version: "lts/*"
                cache: npm
                cache-dependency-path: clients/tablet/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Check formatting and lint
              run: npm run lint

            - name: Type-check
              run: npm run check

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build

    ci-success:
        name: CI Success
        needs: [quick-checks, rust, msrv, tablet]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] ||
                   [[ "${{ needs.rust.result }}" != "success" ]] ||
                   [[ "${{ needs.msrv.result }}" != "success" ]] ||
                   [[ "${{ needs.tablet.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
